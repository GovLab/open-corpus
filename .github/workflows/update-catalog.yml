# Regenerates the catalog from Weaviate once a day and commits only when
# something changed. Needs repository secrets WEAVIATE_URL and WEAVIATE_API_KEY
# (a read-only key is enough); without them the job skips itself.
name: Update catalog

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: check
        env:
          WEAVIATE_API_KEY: ${{ secrets.WEAVIATE_API_KEY }}
        run: |
          if [ -z "$WEAVIATE_API_KEY" ]; then
            echo "::notice::WEAVIATE_URL / WEAVIATE_API_KEY secrets are not set; skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v7
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: steps.check.outputs.enabled == 'true'
        run: npm ci
      - if: steps.check.outputs.enabled == 'true'
        run: npm test
      - if: steps.check.outputs.enabled == 'true'
        env:
          WEAVIATE_URL: ${{ secrets.WEAVIATE_URL }}
          WEAVIATE_API_KEY: ${{ secrets.WEAVIATE_API_KEY }}
        run: node scripts/export-urls.mjs
      - if: steps.check.outputs.enabled == 'true'
        run: node scripts/check-links.mjs
      - if: steps.check.outputs.enabled == 'true'
        run: node scripts/build-readme.mjs
      - if: steps.check.outputs.enabled == 'true'
        run: |
          git add -A README.md llms.txt data lists
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update catalog ($(date -u +%F))"
          git push
